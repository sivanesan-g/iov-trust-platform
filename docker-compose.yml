version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iov
      POSTGRES_USER: iov
      POSTGRES_PASSWORD: iov_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iov -d iov"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://iov:iov_password@postgres:5432/iov
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      APP_ENV: development
    ports:
      - "5000:5000"
    command: python app.py

  simulator:
    build: .
    depends_on:
      backend:
        condition: service_started
    command: python simulator/run.py --vehicles 10 --interval 0.1 --attack-rate 0.10
